<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Hackathon Gate</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icon.svg">
    <!-- HTML5 QR Code Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-bright": "#faf8ff",
                        "secondary-fixed-dim": "#62df7d",
                        "on-tertiary-container": "#ffede6",
                        "surface": "#faf8ff",
                        "on-error": "#ffffff",
                        "surface-variant": "#e1e2ed",
                        "tertiary-fixed-dim": "#ffb596",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#ffdbcd",
                        "primary-fixed-dim": "#b4c5ff",
                        "on-tertiary-fixed-variant": "#7d2d00",
                        "on-primary-container": "#eeefff",
                        "on-secondary-fixed-variant": "#005320",
                        "surface-tint": "#0053db",
                        "on-surface-variant": "#434655",
                        "surface-container-highest": "#e1e2ed",
                        "surface-container-high": "#e7e7f3",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "secondary-container": "#7cf994",
                        "primary-container": "#2563eb",
                        "on-secondary-container": "#007230",
                        "inverse-primary": "#b4c5ff",
                        "primary": "#004ac6",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#7ffc97",
                        "surface-dim": "#d9d9e5",
                        "surface-container-lowest": "#ffffff",
                        "on-secondary": "#ffffff",
                        "on-background": "#191b23",
                        "on-tertiary-fixed": "#360f00",
                        "outline-variant": "#c3c6d7",
                        "tertiary-container": "#bc4800",
                        "inverse-surface": "#2e3039",
                        "tertiary": "#943700",
                        "on-primary": "#ffffff",
                        "primary-fixed": "#dbe1ff",
                        "secondary": "#006e2d",
                        "outline": "#737686",
                        "surface-container": "#ededf9",
                        "on-secondary-fixed": "#002109",
                        "inverse-on-surface": "#f0f0fb",
                        "surface-container-low": "#f3f3fe",
                        "background": "#faf8ff",
                        "on-surface": "#191b23",
                        "on-primary-fixed-variant": "#003ea8",
                        "on-primary-fixed": "#00174b"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "xs": "4px",
                        "unit": "4px",
                        "tap-target-min": "48px",
                        "xl": "32px",
                        "md": "16px",
                        "lg": "24px",
                        "sm": "8px",
                        "gutter": "16px"
                    },
                    "fontFamily": {
                        "h2": ["Inter"],
                        "label-md": ["Inter"],
                        "label-bold": ["Inter"],
                        "h3": ["Inter"],
                        "caption": ["Inter"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"],
                        "h1": ["Inter"]
                    },
                    "fontSize": {
                        "h2": ["24px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "label-bold": ["14px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "h3": ["20px", { "lineHeight": "1.3", "fontWeight": "600" }],
                        "caption": ["12px", { "lineHeight": "1.2", "fontWeight": "400" }],
                        "body-md": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "body-lg": ["18px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "h1": ["32px", { "lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
    <style>
        body { min-height: max(884px, 100dvh); }
        .hidden-view { display: none !important; }
        .nav-item-active { color: #1d4ed8 !important; } /* text-blue-700 */
        .nav-item-active .nav-bg { background-color: #eff6ff !important; } /* bg-blue-50 */
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen pb-safe">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-4 left-1/2 -translate-x-1/2 z-[100] flex flex-col gap-2 w-full max-w-sm px-4 pointer-events-none"></div>

    <!-- TopAppBar -->
    <header class="bg-white dark:bg-gray-900 docked full-width top-0 border-b border-gray-200 dark:border-gray-800 flat no shadows flex items-center justify-center px-5 w-full h-14 md:h-16">
        <div class="font-sans text-base font-bold tracking-tight text-lg font-black text-slate-900 dark:text-white uppercase text-center">
            Hackathon Gate
        </div>
    </header>

    <main class="px-margin-mobile pt-lg pb-xl max-w-2xl mx-auto w-full">
        
        <!-- Scanner View -->
        <div id="view-scanner" class="view-section">
            <div class="flex bg-surface-container-highest p-1 rounded-lg mb-lg">
                <button class="flex-1 py-3 text-center rounded-md font-label-md font-bold bg-white text-on-surface shadow-sm cursor-pointer">
                    Scanner
                </button>
                <button class="flex-1 py-3 text-center rounded-md font-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 cursor-pointer" onclick="switchView('manual')">
                    Manual
                </button>
            </div>

            <!-- Camera View Area -->
            <section class="bg-surface-container-lowest rounded-xl overflow-hidden relative flex flex-col items-center justify-center shadow-md mb-lg border border-surface-container-high">
                <div id="qr-reader" class="w-full min-h-[300px]"></div>
                
                <!-- Initial State / Start Camera Button -->
                <div id="camera-overlay" class="absolute inset-0 flex flex-col items-center justify-center border-4 border-dashed border-outline-variant rounded-xl m-sm opacity-95 bg-white z-10 pointer-events-auto">
                    <button id="start-camera-btn" onclick="startScanner()" class="bg-primary text-white font-label-bold px-6 py-3 rounded-lg flex items-center gap-2 hover:bg-blue-700 transition shadow-md">
                        <span class="material-symbols-outlined">qr_code_scanner</span>
                        Start Camera
                    </button>
                    <p class="font-label-md text-on-surface-variant mt-4 text-center px-4">Camera permissions are required to scan team QR codes.</p>
                </div>
            </section>

            <!-- Status Indicator -->
            <div class="flex items-center justify-between bg-surface-container-lowest p-md rounded-xl border border-surface-container-high mb-xl shadow-sm">
                <div class="flex items-center space-x-md">
                    <div id="camera-status-dot" class="w-3 h-3 bg-gray-400 rounded-full"></div>
                    <span id="camera-status-text" class="font-label-md text-label-md text-on-surface">Camera Inactive</span>
                </div>
                <button onclick="stopScanner()" class="font-label-bold text-label-bold text-error min-h-[48px] px-md hover:bg-red-50 rounded-lg transition-colors">
                    Stop Camera
                </button>
            </div>
        </div>

        <!-- Manual Entry View -->
        <div id="view-manual" class="view-section hidden-view">
            <div class="flex bg-surface-container-highest p-1 rounded-lg mb-lg">
                <button class="flex-1 py-3 text-center rounded-md font-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors duration-200 cursor-pointer" onclick="switchView('scanner')">
                    Scanner
                </button>
                <button class="flex-1 py-3 text-center rounded-md font-label-md font-bold bg-white text-on-surface shadow-sm cursor-pointer">
                    Manual
                </button>
            </div>

            <!-- Manual Entry Card -->
            <section class="bg-surface-container-lowest rounded-[16px] p-lg mb-xl shadow-sm border border-surface-container-high">
                <h2 class="font-h3 text-on-surface mb-md">Manual Entry</h2>
                <div class="mb-lg">
                    <label class="block font-label-bold text-on-surface mb-sm" for="team-id">Team ID</label>
                    <input class="w-full bg-[#f3f4f6] text-on-surface rounded-lg px-md py-4 font-body-lg focus:outline-none focus:ring-2 focus:ring-primary-container border-none placeholder:text-outline h-[56px]" id="team-id" placeholder="e.g. TEAM_042" type="text" onkeypress="handleManualSubmitEnter(event)"/>
                </div>
                <button class="w-full bg-[#2563eb] text-white font-label-bold rounded-lg h-[56px] flex items-center justify-center gap-2 hover:bg-primary transition-colors duration-200 cursor-pointer shadow-[0_2px_4px_rgba(0,0,0,0.05)]" onclick="handleManualSubmit()">
                    <span class="material-symbols-outlined">keyboard_return</span>
                    Submit ID
                </button>
            </section>
        </div>

        <!-- Shared Recent Activity for Scanner & Manual -->
        <section id="recent-activity-section" class="mb-xl">
            <div class="bg-surface-container-lowest rounded-[16px] overflow-hidden border border-surface-container-high shadow-sm">
                <button onclick="toggleActivityDropdown()" class="w-full flex items-center justify-between p-md bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer outline-none">
                    <h3 class="font-h3 text-on-surface m-0 flex items-center gap-2">
                        <span class="material-symbols-outlined text-primary">history</span>
                        Recent Activity
                    </h3>
                    <span id="activity-chevron" class="material-symbols-outlined transition-transform duration-300">expand_more</span>
                </button>
                <div id="activity-dropdown-content" class="hidden">
                    <ul id="activity-list" class="divide-y divide-[#f3f4f6]">
                        <!-- Activities populated by JS -->
                    </ul>
                    <div id="no-activity" class="p-lg text-center text-on-surface-variant font-body-md hidden">
                        No recent activity yet.
                    </div>
                </div>
            </div>
        </section>

        <!-- Stats / Leaderboard View -->
        <div id="view-stats" class="view-section hidden-view">
            <section class="bg-surface-container-lowest rounded-[16px] p-lg mb-xl shadow-sm border border-surface-container-high">
                <div class="flex justify-between items-center mb-md">
                    <h2 class="font-h3 text-on-surface">Leaderboard</h2>
                    <button id="export-csv-btn" class="bg-primary text-white text-sm font-label-bold px-3 py-2 rounded-lg flex items-center gap-1 hover:bg-blue-700 transition shadow-sm">
                        <span class="material-symbols-outlined text-[18px]">download</span> Export CSV
                    </button>
                </div>
                <p class="font-body-md text-on-surface-variant mb-lg">Live ranking of teams by total time spent inside the venue.</p>
                
                <div class="bg-white rounded-[12px] border border-[#f3f4f6] overflow-hidden">
                    <ul id="leaderboard-list" class="divide-y divide-[#f3f4f6]">
                        <!-- Leaderboard populated by JS -->
                    </ul>
                    <div id="no-stats" class="p-lg text-center text-on-surface-variant font-body-md hidden">
                        No team data recorded yet.
                    </div>
                </div>
            </section>
        </div>

    </main>

    <!-- BottomNavBar -->
    <nav class="bg-white dark:bg-gray-900 docked full-width bottom-0 z-50 border-t border-gray-200 dark:border-gray-800 shadow-[0_-1px_3px_0_rgba(0,0,0,0.05)] fixed bottom-0 w-full flex justify-around items-center h-16 pb-safe px-2">
        <a id="nav-scanner" class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 px-4 py-1.5 hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out nav-item-active cursor-pointer" onclick="switchMainTab('scanner')">
            <div class="nav-bg rounded-xl px-4 py-0.5 flex flex-col items-center">
                <span class="material-symbols-outlined text-[24px]">qr_code_scanner</span>
            </div>
            <span class="text-[11px] font-bold uppercase tracking-wider mt-1">Scanner</span>
        </a>
        <a id="nav-manual" class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 px-4 py-1.5 hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out cursor-pointer" onclick="switchMainTab('manual')">
            <div class="nav-bg rounded-xl px-4 py-0.5 flex flex-col items-center">
                <span class="material-symbols-outlined text-[24px]">edit_note</span>
            </div>
            <span class="text-[11px] font-bold uppercase tracking-wider mt-1">Manual</span>
        </a>
        <a id="nav-stats" class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 px-4 py-1.5 hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out cursor-pointer" onclick="switchMainTab('stats')">
            <div class="nav-bg rounded-xl px-4 py-0.5 flex flex-col items-center">
                <span class="material-symbols-outlined text-[24px]">bar_chart</span>
            </div>
            <span class="text-[11px] font-bold uppercase tracking-wider mt-1">Stats</span>
        </a>
    </nav>

    <script type="module" src="./app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('SW registered: ', registration.scope);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            });
        }
    </script>
</body>
</html>
