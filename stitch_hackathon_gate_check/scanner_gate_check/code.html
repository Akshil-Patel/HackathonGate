<body class="bg-surface-bright text-on-surface antialiased min-h-screen flex flex-col pb-24 font-body-md">
<!-- TopAppBar -->
<header class="flex items-center justify-between px-5 w-full h-14 md:h-16 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 docked full-width top-0 sticky z-40">
<div class="flex items-center text-blue-600 dark:text-blue-500 hover:bg-gray-50 dark:hover:bg-gray-800 active:opacity-70 transition-opacity p-2 rounded-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="event">event</span>
</div>
<h1 class="font-sans text-base font-bold tracking-tight text-lg font-black text-slate-900 dark:text-white uppercase">Hackathon Gate</h1>
<div class="flex items-center text-blue-600 dark:text-blue-500 hover:bg-gray-50 dark:hover:bg-gray-800 active:opacity-70 transition-opacity p-2 rounded-full cursor-pointer">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
</div>
</header>
<main class="flex-grow px-margin-mobile pt-lg max-w-2xl mx-auto w-full">
<!-- Toggle Tabs -->
<div class="bg-surface-variant p-sm rounded-lg flex space-x-sm mb-lg">
<button class="flex-1 bg-surface-container-lowest text-on-surface shadow-sm rounded-md py-sm font-label-bold text-label-bold flex items-center justify-center min-h-[48px]">
                Scanner
            </button>
<button class="flex-1 text-on-surface-variant hover:bg-surface-container-high rounded-md py-sm font-label-bold text-label-bold flex items-center justify-center min-h-[48px] transition-colors">
                Manual
            </button>
</div>
<!-- Camera View Area -->
<section class="bg-on-surface rounded-xl overflow-hidden aspect-square relative flex items-center justify-center shadow-md mb-lg">
<div class="absolute inset-0 w-full h-full opacity-0 pointer-events-none" id="qr-reader"></div>
<!-- Placeholder Visual -->
<div class="absolute inset-0 flex flex-col items-center justify-center border-4 border-dashed border-outline-variant rounded-xl m-md opacity-50">
<span class="material-symbols-outlined text-[64px] text-surface-container-lowest mb-sm" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
<p class="font-label-md text-label-md text-surface-container-lowest">Align QR within frame</p>
</div>
<!-- Scanning Line Animation Placeholder -->
<div class="absolute top-1/2 left-md right-md h-[2px] bg-primary shadow-[0_0_8px_2px_rgba(37,99,235,0.5)]"></div>
</section>
<!-- Status Indicator / Action Area -->
<div class="flex items-center justify-between bg-surface-container-lowest p-md rounded-xl border border-surface-container-high mb-xl shadow-sm">
<div class="flex items-center space-x-md">
<div class="w-3 h-3 bg-secondary rounded-full animate-pulse"></div>
<span class="font-label-md text-label-md text-on-surface">Camera Active</span>
</div>
<button class="font-label-bold text-label-bold text-primary min-h-[48px] px-md hover:bg-surface-container-low rounded-lg transition-colors">
                Switch Camera
            </button>
</div>
<!-- Recent Activity Section -->
<section>
<h2 class="font-h3 text-h3 text-on-surface mb-md px-xs">Recent Activity</h2>
<div class="space-y-sm">
<!-- Activity Card IN -->
<div class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-surface-container-high">
<div class="flex items-center space-x-md">
<div class="bg-surface-container-low p-sm rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-on-surface">T-4021</p>
<p class="font-caption text-caption text-on-surface-variant">2 mins ago</p>
</div>
</div>
<div class="bg-[#dbe1ff] text-[#00174b] px-md py-xs rounded-full font-label-bold text-caption">
                        IN
                    </div>
</div>
<!-- Activity Card OUT -->
<div class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-surface-container-high">
<div class="flex items-center space-x-md">
<div class="bg-surface-container-low p-sm rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-on-surface">T-8933</p>
<p class="font-caption text-caption text-on-surface-variant">15 mins ago</p>
</div>
</div>
<div class="bg-[#7cf994] text-[#002109] px-md py-xs rounded-full font-label-bold text-caption">
                        OUT
                    </div>
</div>
<!-- Activity Card IN -->
<div class="bg-surface-container-lowest p-md rounded-xl flex items-center justify-between border border-surface-container-high">
<div class="flex items-center space-x-md">
<div class="bg-surface-container-low p-sm rounded-lg text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="person">person</span>
</div>
<div>
<p class="font-label-bold text-label-bold text-on-surface">T-2114</p>
<p class="font-caption text-caption text-on-surface-variant">42 mins ago</p>
</div>
</div>
<div class="bg-[#dbe1ff] text-[#00174b] px-md py-xs rounded-full font-label-bold text-caption">
                        IN
                    </div>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center h-16 pb-safe px-2 bg-white dark:bg-gray-900 z-50 border-t border-gray-200 dark:border-gray-800 shadow-[0_-1px_3px_0_rgba(0,0,0,0.05)] md:hidden">
<!-- Scanner (Active) -->
<div class="flex flex-col items-center justify-center bg-blue-50 dark:bg-blue-900/40 text-blue-700 dark:text-blue-300 rounded-xl px-4 py-1.5 flex-1 max-w-[100px] hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="qr_code_scanner" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
<span class="text-[11px] font-bold uppercase tracking-wider">Scanner</span>
</div>
<!-- Manual (Inactive) -->
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 px-4 py-1.5 flex-1 max-w-[100px] hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="edit_note">edit_note</span>
<span class="text-[11px] font-bold uppercase tracking-wider">Manual</span>
</div>
<!-- Stats (Inactive) -->
<div class="flex flex-col items-center justify-center text-gray-400 dark:text-gray-500 px-4 py-1.5 flex-1 max-w-[100px] hover:text-blue-500 dark:hover:text-blue-400 active:scale-95 transition-all duration-200 ease-in-out cursor-pointer">
<span class="material-symbols-outlined mb-1" data-icon="bar_chart">bar_chart</span>
<span class="text-[11px] font-bold uppercase tracking-wider">Stats</span>
</div>
</nav>
